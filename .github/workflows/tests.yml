name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API tests (Rest Assured)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run @api scenarios
        run: mvn -B --no-transfer-progress clean test -Dtest=ApiRunner
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            target/api-report.*
            target/surefire-reports/
          if-no-files-found: ignore

  ui:
    name: UI tests (Selenium, headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run UI scenarios
        run: mvn -B --no-transfer-progress clean test -Dtest=UiRunner -Dheadless=true
      - name: Summarise failure pages (links, buttons, inputs)
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, html
          for f in sorted(glob.glob('target/failures/*.html')):
              s = open(f, encoding='utf-8', errors='ignore').read()
              print('=' * 30, f, s.splitlines()[0])
              for m in sorted(set(re.findall(r'<a\b[^>]*href="([^"]*)"[^>]*>(.*?)</a>', s, re.S))):
                  print('LINK', m[0], '|', re.sub(r'<[^>]+>|\s+', ' ', html.unescape(m[1])).strip()[:60])
              for tag in re.findall(r'<(?:button|input|select|textarea)\b[^>]*>', s):
                  print('CTRL', tag[:220])
              for m in re.findall(r'(?:id|class)="([^"]*(?:cart|product|search|registration|qty|quantity)[^"]*)"', s, re.I)[:40]:
                  print('HINT', m)
          EOF
          for p in / /ecommerce /ecommerce/login /registration; do
            echo "========== CURL $p"
            curl -sL "https://practice.qabrains.com$p" | grep -oE '<a [^>]*href="[^"]*"|<button[^>]{0,160}|<input[^>]{0,200}|id="[^"]*"' | sort -u | head -80
          done

      - name: Upload UI report and failure pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report
          path: |
            target/ui-report.*
            target/failures/
            target/surefire-reports/
          if-no-files-found: ignore

  probe:
    name: Probe site structure (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump rendered DOM of practice pages
        run: |
          for p in / /registration /ecommerce /e-commerce /forgot-password /ecommerce/products /cart; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://practice.qabrains.com$p")
            echo "################ $p  (HTTP $code)"
            google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=15000 --window-size=1920,1080 --dump-dom "https://practice.qabrains.com$p" > page.html 2>/dev/null
            python3 - <<'PY'
          import re, html
          s = open('page.html', encoding='utf-8', errors='ignore').read()
          print('TITLE', re.findall(r'<title>(.*?)</title>', s)[:1])
          for mid in sorted(set(re.findall(r'data-menu-id="[^"]*?-([a-z0-9-]+)"', s))):
              print('MENU', mid)
          for m in sorted(set(re.findall(r'<a\b[^>]*href="(/[^"]*)"', s))):
              print('LINK', m)
          for tag in re.findall(r'<(?:button|input|select|textarea)\b[^>]*>', s)[:40]:
              print('CTRL', re.sub(r'class="[^"]*"', '', tag)[:200])
          for t in re.findall(r'<(?:h1|h2|h3)\b[^>]*>(.*?)</(?:h1|h2|h3)>', s, re.S)[:15]:
              print('HEAD', re.sub(r'<[^>]+>|\s+', ' ', html.unescape(t)).strip()[:80])
          for c in sorted(set(re.findall(r'class="([^"]*(?:cart|product|card|qty|quantity|search)[^"]*)"', s, re.I)))[:25]:
              print('CLASS', c[:150])
          PY
          done
